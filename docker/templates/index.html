<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ app_name }}</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root { --acento: #2563eb; --fondo: #f8fafc; --tarjeta: #ffffff; --texto: #0f172a; --borde: #e2e8f0; --error: #dc2626; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, sans-serif; background: var(--fondo); color: var(--texto); }
  header { background: var(--tarjeta); border-bottom: 1px solid var(--borde); padding: 16px 24px; }
  header h1 { font-size: 20px; font-weight: 600; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 16px; display: grid; gap: 16px; }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px; padding: 20px; }
  .tarjeta h2 { font-size: 15px; margin-bottom: 12px; }
  .fila { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  button { background: var(--acento); color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  select, input[type=date] { padding: 8px; border: 1px solid var(--borde); border-radius: 8px; font-size: 14px; }
  #resultado, #aviso { font-size: 13px; color: #475569; }
  .error { color: var(--error) !important; }
  #detalleErrores { font-size: 12px; color: #92400e; margin-top: 8px; padding-left: 18px; }
  .stats { display: flex; gap: 24px; margin-top: 12px; font-size: 13px; color: #475569; }
  .stats b { color: var(--texto); font-size: 16px; display: block; }
</style>
</head>
<body>
<header><h1>{{ app_name }}</h1></header>
<main>
  <section class="tarjeta">
    <h2>Carga masiva de datos (CSV)</h2>
    <div class="fila">
      <input type="file" id="archivo" accept=".csv,.txt,text/csv">
      <button id="btnImportar">Cargar CSV</button>
      <span id="resultado"></span>
    </div>
    <ul id="detalleErrores"></ul>
  </section>

  <section class="tarjeta">
    <h2>Histórico por sensor</h2>
    <div class="fila">
      <select id="sensor"><option value="">— sin datos —</option></select>
      <input type="date" id="desde">
      <input type="date" id="hasta">
      <button id="btnVer">Ver</button>
      <span id="aviso"></span>
    </div>
    <div class="stats">
      <span>Mínima <b id="stMin">–</b></span>
      <span>Máxima <b id="stMax">–</b></span>
      <span>Promedio <b id="stProm">–</b></span>
      <span>Lecturas <b id="stTotal">–</b></span>
    </div>
    <canvas id="grafica" height="90" style="margin-top:16px"></canvas>
  </section>
</main>

<script>
let grafica = null;
const $ = id => document.getElementById(id);

async function llamar(url, opciones) {
  let r;
  try {
    r = await fetch(url, opciones);
  } catch {
    throw new Error('No se pudo conectar con el servidor. ¿Está corriendo el contenedor?');
  }
  let j;
  try {
    j = await r.json();
  } catch {
    throw new Error('Respuesta inesperada del servidor (HTTP ' + r.status + ').');
  }
  if (!r.ok) throw new Error(j.error || ('Error HTTP ' + r.status));
  return j;
}

function aviso(el, msg, esError) {
  el.textContent = msg || '';
  el.classList.toggle('error', !!esError);
}

async function cargarSensores() {
  try {
    const lista = await llamar('/api/sensores');
    const sel = $('sensor');
    sel.innerHTML = lista.length
      ? lista.map(s => `<option value="${s.sensor}">${s.sensor} (${s.lecturas} lecturas)</option>`).join('')
      : '<option value="">— sin datos —</option>';
    aviso($('aviso'), lista.length ? '' : 'Carga primero un CSV para ver datos.');
  } catch (e) {
    aviso($('aviso'), e.message, true);
  }
}

$('btnImportar').onclick = async () => {
  const input = $('archivo');
  const out = $('resultado');
  const detalle = $('detalleErrores');
  detalle.innerHTML = '';
  if (!input.files.length) { aviso(out, 'Selecciona un archivo CSV primero.', true); return; }
  const f = input.files[0];
  if (!/\.(csv|txt)$/i.test(f.name)) { aviso(out, 'El archivo debe ser .csv o .txt.', true); return; }
  if (f.size === 0) { aviso(out, 'El archivo está vacío.', true); return; }
  if (f.size > 64 * 1024 * 1024) { aviso(out, 'El archivo supera el límite de 64 MB.', true); return; }

  const fd = new FormData();
  fd.append('archivo', f);
  $('btnImportar').disabled = true;
  aviso(out, 'Cargando…');
  try {
    const j = await llamar('/api/importar', { method: 'POST', body: fd });
    aviso(out, `Insertadas: ${j.insertadas} · Duplicadas: ${j.duplicadas} · Con error: ${j.errores}`, false);
    if (j.detalle_errores && j.detalle_errores.length) {
      detalle.innerHTML = j.detalle_errores.map(e => `<li>Línea ${e.linea}: ${e.motivo}</li>`).join('')
        + (j.errores > j.detalle_errores.length ? `<li>… y ${j.errores - j.detalle_errores.length} más</li>` : '');
    }
    cargarSensores();
  } catch (e) {
    aviso(out, e.message, true);
  } finally {
    $('btnImportar').disabled = false;
  }
};

$('btnVer').onclick = async () => {
  const sensor = $('sensor').value;
  if (!sensor) { aviso($('aviso'), 'No hay sensor seleccionado.', true); return; }
  let desde = $('desde').value, hasta = $('hasta').value;
  if (desde && hasta && desde > hasta) { [desde, hasta] = [hasta, desde]; $('desde').value = desde; $('hasta').value = hasta; }
  const params = new URLSearchParams({ sensor });
  if (desde) params.set('desde', desde);
  if (hasta) params.set('hasta', hasta);
  $('btnVer').disabled = true;
  try {
    const j = await llamar('/api/historico?' + params);
    aviso($('aviso'), j.stats.total ? '' : 'Sin lecturas en ese rango de fechas.');
    const f = v => v == null ? '–' : v.toFixed(1) + ' °C';
    $('stMin').textContent = f(j.stats.min);
    $('stMax').textContent = f(j.stats.max);
    $('stProm').textContent = f(j.stats.prom);
    $('stTotal').textContent = j.stats.total;
    if (grafica) grafica.destroy();
    grafica = new Chart($('grafica'), {
      type: 'line',
      data: {
        labels: j.puntos.map(p => p.ts),
        datasets: [{
          label: 'Temperatura (°C)',
          data: j.puntos.map(p => p.temp),
          borderColor: getComputedStyle(document.documentElement).getPropertyValue('--acento'),
          pointRadius: 0,
          borderWidth: 1.5,
          tension: 0.2
        }]
      },
      options: {
        animation: false,
        scales: { x: { ticks: { maxTicksLimit: 12 } } },
        plugins: { legend: { display: false } }
      }
    });
  } catch (e) {
    aviso($('aviso'), e.message, true);
  } finally {
    $('btnVer').disabled = false;
  }
};

cargarSensores();
</script>
</body>
</html>
